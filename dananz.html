<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            padding: 20px 20px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            /* width: 60%; */
        }

        .nav {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 60%;
            font-size: 17px;
            font-weight: 400;
        }

        .contact_button {
            margin-left: 25px;
            background-color: #2C3878;
            color: white;
            padding: 14px 32px 14px 32px;
            border: 1px;
        }

        .about {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 70px;
        }

        .title_text {
            font-weight: 700;
            font-size: 55px;
            line-height: 140%;
            color: black;
        }

        .about_text {
            width: 35%;
            line-height: 160%;
            letter-spacing: 0%;
            font-size: 18px;
            padding-top: 30px;
        }

        .about_image {
            padding-top: 50px;
            width: 100%;
            height: 630px;
            object-fit: cover;
        }
    </style>

</head>

<body>

    <div class="container">
        <header class="header">
                <div class="logo"><img src="./logo.svg"></img></div>
                <div class="nav">


                    <div class="link">Home</div>

                    <div class="link">About us</div>
                    <div class="link">Services</div>
                    <div class="link">Our Team</div>
                    <div class="contact">
                        <button class="contact_button">Contact Us</button>
                    </div>
                </div>

        </header>
        <section class="about">
            <div class="title_text">About</div>
            <div class="about_text">It is a long established fact that a reader will be distracted by the readable content
                of a page when looking at its layout.</div>
            <img class="about_image" src="./7c8fe6b5fdc4a29a652e2868b284bdfd36763913.jpg" alt="">
        </section>
    </div>

</body>

</html>
