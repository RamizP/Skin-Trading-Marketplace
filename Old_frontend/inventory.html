<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inventory</title>
<style>
  body { font-family: Arial; max-width: 800px; margin: 3rem auto; padding: 1rem; }
  .inventory-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    border: 1px solid #ddd;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  .inventory-item img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 6px;
  }
</style>
</head>
<body>
<h1>My Inventory</h1>
<div id="inventoryList">Loading...</div>

<script>
  const API_BASE = 'https://192.168.1.236:8000';
  let entities = [];

  async function loadEntities() {
    try {
      const res = await fetch(`${API_BASE}/entities`, {});
      if (!res.ok) throw new Error('Failed to load entities');
      entities = await res.json();
    } catch (err) {
      alert(err.message);
    }
  }

  async function loadInventory() {
    try {
      const res = await fetch(`${API_BASE}/myinventory`, {});
      if (!res.ok) throw new Error('Failed to load inventory');
      const inventory = await res.json();

      const container = document.getElementById('inventoryList');
      if (inventory.length === 0) {
        container.textContent = 'Inventory is empty.';
        return;
      }

      container.innerHTML = '';
      inventory.forEach(item => {
        const entity = entities.find(e => e.id === item.entity_id);
        const div = document.createElement('div');
        div.className = 'inventory-item';
        div.innerHTML = `
          <img src="images/${entity?.image_url || 'default.png'}" alt="${entity?.name || 'Entity'}" />
          <div>
            <strong>${entity?.name || 'Unknown'}</strong> (${entity?.symbol || '-'})<br />
            Amount: ${item.amount}
          </div>
        `;
        container.appendChild(div);
      });
    } catch (err) {
      document.getElementById('inventoryList').textContent = err.message;
    }
  }

  async function init() {
    await loadEntities();
    await loadInventory();
  }

  window.onload = init;
</script>
</body>
</html>
