<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Entities</title>
<style>
  body { font-family: Arial; max-width: 800px; margin: 3rem auto; padding: 1rem; }
  .entity-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    border: 1px solid #ddd;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  .entity-card img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    border-radius: 8px;
  }
</style>
</head>
<body>
<h1>Entities</h1>
<div id="entities"></div>

<script>
  const API_BASE = 'http://127.0.0.1:8000';

  async function loadEntities() {
    try {
      const res = await fetch(`${API_BASE}/entities`, {credentials: 'include'});
      if (!res.ok) throw new Error('Could not fetch entities');
      const entities = await res.json();

      const container = document.getElementById('entities');
      container.innerHTML = '';

      entities.forEach(entity => {
        const div = document.createElement('div');
        div.className = 'entity-card';
        div.innerHTML = `
          <img src="images/${entity.image_url || 'default.png'}" alt="${entity.name}" />
          <div>
            <h3>${entity.name} (${entity.symbol})</h3>
          </div>
        `;
        container.appendChild(div);
      });

    } catch (err) {
      document.getElementById('entities').textContent = err.message;
    }
  }

  window.onload = loadEntities;
</script>
</body>
</html>
