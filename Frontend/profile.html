<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Profile</title>
<style>
  body { font-family: Arial; max-width: 600px; margin: 3rem auto; padding: 1rem; }
  img { max-width: 120px; border-radius: 50%; }
  #logoutBtn { padding: 0.5rem 1rem; font-size: 1rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Profile</h1>
<div id="profile"></div>
<button id="logoutBtn">Logout</button>

<script>
  const API_BASE = 'https://192.168.1.236:8000';

  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/me`, {});
      if (!res.ok) throw new Error('Failed to fetch profile');
      const user = await res.json();

      document.getElementById('profile').innerHTML = `
        <img src="${user.image_url || 'default-profile.png'}" alt="Profile" />
        <h2>${user.username}</h2>
        <p>Email: ${user.email}</p>
        <p>Role: ${user.role}</p>
        <p>Status: ${user.status}</p>
        <p>Balance: $${user.balance.toFixed(2)}</p>
        <p>Bio: ${user.bio || '-'}</p>
        <p>Location: ${user.location || '-'}</p>
      `;
    } catch (err) {
      document.getElementById('profile').textContent = err.message;
    }
  }

  document.getElementById('logoutBtn').onclick = async () => {
    await fetch(`${API_BASE}/logout`, { method: 'POST' });
    window.location.href = 'login.html';
  };

  window.onload = loadProfile;
</script>
</body>
</html>
