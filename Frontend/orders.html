<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
    }

    section {
      margin-bottom: 2rem;
    }

    .order-card,
    .entity-order-card {
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
    }

    .order-card img,
    .entity-order-card img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>Orders</h1>

  <section>
    <h2>Create Order</h2>
    <select id="entitySelect"></select>
    <input type="number" id="priceInput" placeholder="Price" step="0.01" min="0" />
    <input type="number" id="amountInput" placeholder="Amount" min="1" />
    <button id="createOrderBtn">Create Order</button>
  </section>

  <section>
    <h2>My Orders</h2>
    <button id="loadOrdersBtn">Load My Orders</button>
    <div id="ordersList">Click "Load My Orders" to fetch your orders.</div>
  </section>

  <hr />

  <section>
    <h2>Find Orders by Entity</h2>
    <select id="findEntitySelect"></select>
    <button id="findEntityOrdersBtn">Find Orders</button>
    <div id="entityOrdersList"></div>
  </section>

  <script>
    const API_BASE = 'http://127.0.0.1:8000'; // Adjust if needed
    let entities = [];

    async function loadEntities() {
      try {
        const res = await fetch(`${API_BASE}/entities`, { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load entities');
        entities = await res.json();

        const createSelect = document.getElementById('entitySelect');
        const findSelect = document.getElementById('findEntitySelect');

        [createSelect, findSelect].forEach(select => {
          select.innerHTML = '<option value="">Select entity</option>';
          entities.forEach(e => {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = `${e.name} (${e.symbol})`;
            select.appendChild(opt);
          });
        });
      } catch (err) {
        alert(err.message);
      }
    }

    async function createOrder() {
      const entityId = +document.getElementById('entitySelect').value;
      const price = parseFloat(document.getElementById('priceInput').value);
      const amount = parseInt(document.getElementById('amountInput').value);

      if (!entityId || isNaN(price) || isNaN(amount) || amount < 1) {
        return alert('Please fill all fields correctly');
      }

      try {
        const res = await fetch(`${API_BASE}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ entity_id: entityId, price, amount }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to create order');
        }
        alert('Order created successfully!');
        loadOrders(); // reload user's orders
      } catch (err) {
        alert(err.message);
      }
    }

    async function buyOrder(orderId) {
      try {
        const res = await fetch(`${API_BASE}/order-buy`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ order_id: orderId }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to buy order');
        }

        alert('Order bought successfully!');
        loadOrders(); // reload user's orders
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm('Are you sure you want to delete this order?')) return;

      try {
        const res = await fetch(`${API_BASE}/orders/${orderId}`, {
          method: 'DELETE',
          credentials: 'include',
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to delete order');
        }
        alert('Order deleted successfully!');
        loadOrders(); // reload user's orders
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${API_BASE}/orders`, { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load orders');
        const orders = await res.json();

        const container = document.getElementById('ordersList');
        container.innerHTML = '';

        if (orders.length === 0) {
          container.textContent = 'No orders found.';
          return;
        }

        orders.forEach(order => {
          const entity = entities.find(e => e.id === order.entity_id);
          const div = document.createElement('div');
          div.className = 'order-card';
          div.innerHTML = `
          <img src="images/${entity?.image_url || 'default.png'}" alt="${entity?.name || 'Entity'}" />
          <div>
            <strong>${entity?.name || 'Unknown'}</strong><br />
            Price: $${order.price.toFixed(2)}<br />
            Amount: ${order.amount}<br />
            Created At: ${new Date(order.created_at).toLocaleString()}
          </div>
          <button onclick="deleteOrder(${order.id})">Delete</button>
          <button onclick="editOrder(${order.id})">Edit</button>
        `;
          container.appendChild(div);
        });
      } catch (err) {
        alert(err.message);
      }
    }

    async function findOrdersByEntity() {
      const entityId = document.getElementById('findEntitySelect').value;
      const container = document.getElementById('entityOrdersList');

      if (!entityId) {
        return alert('Please select an entity');
      }

      try {
        const res = await fetch(`${API_BASE}/orders/${entityId}`, { credentials: 'include' });
        if (!res.ok) throw new Error('Failed to load orders for this entity');
        const orders = await res.json();

        container.innerHTML = '';
        if (orders.length === 0) {
          container.textContent = 'No orders found for this entity.';
          return;
        }

        orders.forEach(order => {
          const entity = entities.find(e => e.id == entityId);
          const div = document.createElement('div');
          div.className = 'entity-order-card';
          div.innerHTML = `
          <img src="images/${entity?.image_url || 'default.png'}" alt="${entity?.name}" />
          <div>
            <strong>${entity?.name}</strong> (${entity?.symbol})<br />
            Price: $${order.price.toFixed(2)}<br />
            Amount: ${order.amount}<br />
            Created: ${new Date(order.created_at).toLocaleString()}
          </div>
          <button onclick="deleteOrder(${order.id})">Delete</button>
          <button onclick="buyOrder(${order.id})">Buy</button>
        `;
          container.appendChild(div);
        });

      } catch (err) {
        container.textContent = err.message;
      }
    }

    document.getElementById('createOrderBtn').onclick = createOrder;
    document.getElementById('loadOrdersBtn').onclick = loadOrders;
    document.getElementById('findEntityOrdersBtn').onclick = findOrdersByEntity;

    window.onload = loadEntities;
  </script>

</body>

</html>
