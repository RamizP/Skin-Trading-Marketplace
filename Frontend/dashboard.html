<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <h1>User Dashboard</h1>
    <section>
      <h2>User Info</h2>
      <button onclick="getMe()">Load Info</button>
      <div id="user-info" class="card"></div>
    </section>

    <section>
      <h2>Charge Balance</h2>
      <input id="charge-amount" type="number" placeholder="Amount" />
      <button onclick="chargeBalance()">Charge</button>
    </section>
  </main>

  <div id="footer"></div>

  <script src="app.js"></script>
  <script>
    // Load header and footer
    document.getElementById('header').innerHTML = await (await fetch('header.html')).text();
    document.getElementById('footer').innerHTML = await (await fetch('footer.html')).text();
  </script>
</body>
</html>
